name: Déploiement
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: eu-west-3
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Construire et publier les images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build --provenance=false -f docker/api.Dockerfile -t "$REGISTRY/communitylens-api:$TAG" .
          docker build --provenance=false -f docker/job.Dockerfile -t "$REGISTRY/communitylens-job:$TAG" .
          docker push "$REGISTRY/communitylens-api:$TAG"
          docker push "$REGISTRY/communitylens-job:$TAG"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Appliquer l'infrastructure
        working-directory: infra/terraform
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=communitylens.tfstate" -backend-config="region=${{ env.AWS_REGION }}"
          terraform apply -auto-approve
          echo "SITE_BUCKET=$(terraform output -raw site_bucket)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION=$(terraform output -raw distribution_id)" >> "$GITHUB_ENV"
          echo "DATA_BUCKET=$(terraform output -raw data_bucket)" >> "$GITHUB_ENV"
      - name: Publier le site et les résultats d'évaluation
        run: |
          aws s3 cp results/forecast_eval.json "s3://$DATA_BUCKET/serving/metrics.json"
          aws s3 sync frontend "s3://$SITE_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"

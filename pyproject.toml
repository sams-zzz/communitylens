[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "communitylens"
version = "0.1.0"
description = "Prévision de risque et vérification des affirmations pour communautés d'investisseurs"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "requests>=2.32,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
job = [
  "pandas>=2.2,<4",
  "pyarrow>=18",
  "scikit-learn>=1.5,<2",
  "yfinance>=0.2.60",
]
eval = ["communitylens[job]", "xgboost-cpu>=2.1,<4"]
ui = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]
dev = [
  "communitylens[eval]",
  "black>=24",
  "bandit>=1.7",
  "httpx>=0.27",
  "moto[s3,dynamodb]>=5",
  "pre-commit>=3.8",
  "pylint>=3.3",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
communitylens-job = "communitylens.jobs.daily:main"
communitylens-eval = "communitylens.evaluation.forecast_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
communitylens = ["llm/prompts/*.txt"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["communitylens"]
omit = ["*/evaluation/forecast_eval.py"]

[tool.pylint.main]
source-roots = ["src"]
ignore-paths = ["tests/.*"]

[tool.pylint.basic]
docstring-min-length = 8

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["too-few-public-methods", "invalid-name"]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-attributes = 20
max-locals = 20

[tool.pylint.similarities]
min-similarity-lines = 8
